name: Popup Launcher - Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: popup-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Validate + Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # 1) Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2) Locate project root.
      # Supports either:
      #   A) Android source committed directly to the repository
      #   B) A single/first ZIP containing the Android project
      # ------------------------------------------------------------
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Using Android project at repository root: $PROJECT_DIR"
          else
            echo "No Gradle project at repository root. Searching for ZIP..."

            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -path "$GITHUB_WORKSPACE/.git" -prune -o \
              -type f -name '*.zip' -print | head -n 1 || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::No settings.gradle(.kts) and no project ZIP was found."
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"

            EXTRACT_DIR="$RUNNER_TEMP/popup-launcher-project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" \
              -path '*/.gradle/*' -prune -o \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -type f -print | head -n 1 || true)"

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::ZIP was extracted, but settings.gradle(.kts) was not found."
              find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -500 || true
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            echo "Using extracted Android project: $PROJECT_DIR"
          fi

          {
            echo "project_dir=$PROJECT_DIR"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3) Java 17
      # IMPORTANT: no setup-java Gradle cache here.
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ------------------------------------------------------------
      # 4) Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.BUILD_TOOLS }}

      # ------------------------------------------------------------
      # 5) Gradle 8.9
      # This project archive does not contain gradle-wrapper.jar,
      # therefore we provision Gradle directly instead of ./gradlew.
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # The Android project may be extracted into RUNNER_TEMP.
          # Disable setup-gradle cache key discovery because that step
          # only scans the GitHub workspace and would fail before build.
          cache-disabled: true

      # ------------------------------------------------------------
      # 6) Toolchain verification
      # ------------------------------------------------------------
      - name: Verify toolchain
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo '===== Java ====='
          java -version

          echo '===== Gradle ====='
          gradle --version

          echo '===== Android SDK ====='
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          sdkmanager --list_installed | sed -n '1,140p' || true

      # ------------------------------------------------------------
      # 7) Structural validation
      # ------------------------------------------------------------
      - name: Validate project structure
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]
          [[ -f "build.gradle.kts" || -f "build.gradle" ]]
          [[ -d "app" ]]
          [[ -f "app/build.gradle.kts" || -f "app/build.gradle" ]]
          [[ -f "app/src/main/AndroidManifest.xml" ]]

          echo 'Project structure OK.'

      # ------------------------------------------------------------
      # 8) Configuration validation
      # ------------------------------------------------------------
      - name: Validate Android configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="app/build.gradle.kts"
          MANIFEST="app/src/main/AndroidManifest.xml"

          [[ -f "$APP_GRADLE" ]]
          [[ -f "$MANIFEST" ]]

          grep -q 'minSdk = 24' "$APP_GRADLE"
          grep -q 'targetSdk = 35' "$APP_GRADLE"
          grep -q 'isMinifyEnabled = true' "$APP_GRADLE"
          grep -q 'isShrinkResources = true' "$APP_GRADLE"

          grep -q 'android:foregroundServiceType="specialUse"' "$MANIFEST"
          grep -q 'PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$MANIFEST"

          echo 'Critical Android configuration OK.'

      # ------------------------------------------------------------
      # 9) Fast source sanity checks
      # ------------------------------------------------------------
      - name: Validate Kotlin and XML syntax inputs
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          AIDL="app/src/main/aidl/com/example/popuplauncher/IShellCommandService.aidl"
          [[ -f "$AIDL" ]]

          find app/src/main -type f \( -name '*.kt' -o -name '*.xml' -o -name '*.aidl' \) -print0 \
            | xargs -0 -r grep -Il $'\xEF\xBF\xBD' >/tmp/bad-unicode.txt || true

          if [[ -s /tmp/bad-unicode.txt ]]; then
            echo '::error::Replacement-character U+FFFD found in source files:'
            cat /tmp/bad-unicode.txt
            exit 1
          fi

          echo 'Source sanity checks OK.'

      # ------------------------------------------------------------
      # 10) Lint
      # ------------------------------------------------------------
      - name: Android Lint
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:lintDebug

      # ------------------------------------------------------------
      # 11) Unit tests
      # ------------------------------------------------------------
      - name: Unit tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      # ------------------------------------------------------------
      # 12) Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      # ------------------------------------------------------------
      # 13) Release APK
      # ------------------------------------------------------------
      - name: Build Release APK
        id: release
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      # ------------------------------------------------------------
      # 14) Verify APKs + checksums
      # ------------------------------------------------------------
      - name: Verify APK outputs
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print | head -n 1 || true)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -n 1 || true)"

          [[ -n "$DEBUG_APK" ]]
          [[ -n "$RELEASE_APK" ]]

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$DEBUG_APK" "$GITHUB_WORKSPACE/artifacts/PopupLauncher-debug.apk"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/artifacts/PopupLauncher-release.apk"

          (cd "$GITHUB_WORKSPACE/artifacts" && sha256sum *.apk > SHA256SUMS.txt)

          echo "Debug APK: $DEBUG_APK"
          echo "Release APK: $RELEASE_APK"
          echo '===== SHA-256 ====='
          cat "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"

      # ------------------------------------------------------------
      # 15) Upload artifacts
      # ------------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PopupLauncher-debug-${{ github.sha }}
          path: artifacts/PopupLauncher-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PopupLauncher-release-${{ github.sha }}
          path: artifacts/PopupLauncher-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: PopupLauncher-checksums-${{ github.sha }}
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          
